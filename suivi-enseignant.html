<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>📊 Suivi enseignant — Commando CM2</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            color: #f0ede8;
            font-family: 'DM Sans', sans-serif;
            padding: 2rem;
            font-size: 16px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .gold {
            color: #e8c87a;
        }
        .sub {
            color: #9aaec9;
            margin-bottom: 2rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #111118;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #5ecfb1;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #aaa;
        }
        .alert-card {
            background: #1e1a2a;
            border-left: 4px solid #f5a623;
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
        }
        .alert-warning {
            border-left-color: #f5a623;
        }
        .alert-danger {
            border-left-color: #f55a5a;
        }
        .alert-success {
            border-left-color: #5ecfb1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #111118;
            border-radius: 1rem;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: #1e2a3e;
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #5ecfb1;
        }
        tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .btn-refresh {
            background: #1e2a3e;
            border: 1px solid rgba(94,207,177,0.3);
            border-radius: 60px;
            padding: 0.5rem 1rem;
            color: white;
            cursor: pointer;
            margin-bottom: 1rem;
            font-family: 'DM Mono', monospace;
        }
        .btn-refresh:hover {
            background: #2a3652;
        }
        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #5e6c8c;
        }
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            table, thead, tbody, th, td, tr {
                display: block;
            }
            th {
                display: none;
            }
            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }
            td::before {
                content: attr(data-label);
                font-weight: bold;
                width: 40%;
                color: #5ecfb1;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
            <h1>📊 Suivi <span class="gold">enseignant</span></h1>
            <div class="sub">Commando CM2 — Évaluations nationales</div>
        </div>
        <button class="btn-refresh" id="refreshBtn">⟳ Actualiser les données</button>
    </div>

    <div id="alerts-container"></div>

    <div class="stats-grid" id="stats-container"></div>

    <h2 style="margin: 1rem 0 0.5rem;">📋 Détail des élèves</h2>
    <table id="students-table">
        <thead>
            <tr>
                <th>Prénom</th>
                <th>Français (score)</th>
                <th>Maths (score)</th>
                <th>Total sessions</th>
                <th>Dernière activité</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="6">Chargement...</td></tr>
        </tbody>
    </table>
    <div class="footer">
        Données synchronisées avec le Google Sheet · Dernière mise à jour : <span id="last-update"></span>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyDgu0ErJHRYBC8Glo4GXB7UbizWmsvFgaRh8lHUzqTEf7znlrb35l_DNiXYd9lTakq/exec';
    let allData = { francais: [], maths: [] };

    async function fetchData(matiere) {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=getData&matiere=${matiere}`, { method: 'GET', mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            if (result.success && result.data) return result.data;
            return [];
        } catch(e) {
            console.error(`Erreur chargement ${matiere} :`, e);
            return [];
        }
    }

    async function loadAllData() {
        document.getElementById('table-body').innerHTML = '<tr><td colspan="6">Chargement...</td></tr>';
        const [francais, maths] = await Promise.all([ fetchData('Français'), fetchData('Maths') ]);
        allData = { francais, maths };
        processData();
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
    }

    function processData() {
        const eleves = new Map();
        allData.francais.forEach(row => {
            const prenom = row.prenom;
            if (!prenom) return;
            if (!eleves.has(prenom)) eleves.set(prenom, { prenom, sessions: 0, totalFr: 0, nbFr: 0, totalMaths: 0, nbMaths: 0, lastDate: null });
            const e = eleves.get(prenom);
            e.sessions++;
            if (row.score !== undefined && row.score !== null) {
                e.totalFr += parseFloat(row.score) || 0;
                e.nbFr++;
            }
            const date = new Date(row.date);
            if (!e.lastDate || date > e.lastDate) e.lastDate = date;
        });
        allData.maths.forEach(row => {
            const prenom = row.prenom;
            if (!prenom) return;
            if (!eleves.has(prenom)) eleves.set(prenom, { prenom, sessions: 0, totalFr: 0, nbFr: 0, totalMaths: 0, nbMaths: 0, lastDate: null });
            const e = eleves.get(prenom);
            e.sessions++;
            if (row.score !== undefined && row.score !== null) {
                e.totalMaths += parseFloat(row.score) || 0;
                e.nbMaths++;
            }
            const date = new Date(row.date);
            if (!e.lastDate || date > e.lastDate) e.lastDate = date;
        });

        const elevesList = Array.from(eleves.values()).map(e => ({
            prenom: e.prenom,
            moyFr: e.nbFr > 0 ? (e.totalFr / e.nbFr).toFixed(1) : "—",
            moyMaths: e.nbMaths > 0 ? (e.totalMaths / e.nbMaths).toFixed(1) : "—",
            sessions: e.sessions,
            lastDate: e.lastDate ? e.lastDate.toLocaleDateString() : "Jamais",
            lastDateObj: e.lastDate || new Date(0)
        }));
        elevesList.sort((a,b) => a.prenom.localeCompare(b.prenom));

        const tbody = document.getElementById('table-body');
        if (elevesList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Aucune donnée pour le moment.</td></tr>';
        } else {
            tbody.innerHTML = elevesList.map(e => `
                <tr>
                    <td data-label="Prénom"><strong>${e.prenom}</strong></td>
                    <td data-label="Français">${e.moyFr !== "—" ? e.moyFr + "/1" : "—"}</td>
                    <td data-label="Maths">${e.moyMaths !== "—" ? e.moyMaths + "/1" : "—"}</td>
                    <td data-label="Sessions">${e.sessions}</td>
                    <td data-label="Dernière activité">${e.lastDate}</td>
                    <td data-label="Statut">${getStatus(e)}</td>
                </tr>
            `).join('');
        }

        const totalEleves = elevesList.length;
        const totalSessions = elevesList.reduce((acc, e) => acc + e.sessions, 0);
        const avgSessions = totalEleves ? (totalSessions / totalEleves).toFixed(1) : 0;
        const activeEleves = elevesList.filter(e => {
            const daysSince = e.lastDateObj ? Math.floor((new Date() - e.lastDateObj) / (1000*60*60*24)) : 999;
            return daysSince <= 3;
        }).length;
        document.getElementById('stats-container').innerHTML = `
            <div class="stat-card"><div class="stat-number">${totalEleves}</div><div class="stat-label">Élèves ayant commencé</div></div>
            <div class="stat-card"><div class="stat-number">${totalSessions}</div><div class="stat-label">Sessions totales</div></div>
            <div class="stat-card"><div class="stat-number">${avgSessions}</div><div class="stat-label">Moyenne sessions/élève</div></div>
            <div class="stat-card"><div class="stat-number">${activeEleves}</div><div class="stat-label">Élèves actifs (J-3)</div></div>
        `;

        generateAlerts(elevesList);
    }

    function getStatus(e) {
        const daysSince = e.lastDateObj ? Math.floor((new Date() - e.lastDateObj) / (1000*60*60*24)) : 999;
        if (daysSince > 7) return '<span class="badge" style="background:#3a2525; color:#f55a5a;">⚠️ Inactif (7+ j)</span>';
        if (daysSince > 3) return '<span class="badge" style="background:#3a3a20; color:#e8c87a;">⚠️ À relancer</span>';
        if (e.sessions === 0) return '<span class="badge" style="background:#2a3a2a; color:#5ecfb1;">Nouveau</span>';
        return '<span class="badge" style="background:#1e3a2e; color:#7ecf8a;">✓ Actif</span>';
    }

    function generateAlerts(elevesList) {
        const alerts = [];
        const inactive = elevesList.filter(e => {
            const days = e.lastDateObj ? Math.floor((new Date() - e.lastDateObj) / (1000*60*60*24)) : 999;
            return days > 7;
        });
        if (inactive.length > 0) alerts.push(`📢 ${inactive.length} élève(s) inactif(s) depuis plus de 7 jours.`);
        const lowFr = elevesList.filter(e => e.moyFr !== "—" && parseFloat(e.moyFr) < 0.5);
        if (lowFr.length > 0) alerts.push(`📖 ${lowFr.length} élève(s) ont une moyenne faible en français (< 0.5/1).`);
        const lowMaths = elevesList.filter(e => e.moyMaths !== "—" && parseFloat(e.moyMaths) < 0.5);
        if (lowMaths.length > 0) alerts.push(`🧮 ${lowMaths.length} élève(s) ont une moyenne faible en maths (< 0.5/1).`);
        if (alerts.length === 0) alerts.push("✅ Aucune alerte. Tout va bien !");
        document.getElementById('alerts-container').innerHTML = alerts.map(a => `<div class="alert-card alert-warning">⚠️ ${a}</div>`).join('');
    }

    document.getElementById('refreshBtn').addEventListener('click', () => loadAllData());
    loadAllData();
</script>
</body>
</html>
